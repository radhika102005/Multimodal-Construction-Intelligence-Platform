services:
  - type: web
    name: multimodal-construction-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-1.5-flash
      - key: AI_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_MB
        value: 10
      - key: REQUEST_TIMEOUT_SECONDS
        value: 45
